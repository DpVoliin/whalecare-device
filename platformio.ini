; whale-device · T-Display-S3-Pro（222×480 ST7796 + CST226SE 触摸）固件
;
; 构建参数不是我猜的：来自 LilyGo 官方仓库的 platformio.ini（同一块板子验证过）
;   https://github.com/Xinyuan-LilyGO/T-Display-S3-Pro-MVSRBoard/blob/main/platformio.ini
; 引脚来自官方 pin_config.h（只取**数字**，未复制其 GPL 代码 —— 见 THIRD-PARTY.md）
;
; 用法：
;   cp include/secrets.h.example include/secrets.h   # 填 WiFi + 中枢地址 + 设备 token
;   pio run                 # 编译
;   pio run -t upload       # 烧录（插 USB-C；不行就按住 BOOT 再插）

[env:whale]
platform = espressif32
; 用 PlatformIO 自带的 R8N16 板（16MB flash + 8MB octal PSRAM）—— 正好是这块板的规格。
; 官方仓库用的是自定义板名 esp32s3_flash_16MB（要自带 boards/*.json）；这里用自带的少一个文件。
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
board_build.memory_type = qio_opi   ; ★ S3R8 的 PSRAM 是 OPIO（写错就认不到 8MB）
board_upload.speed      = 921600

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; USB 口当串口用（看日志靠它）
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D CORE_DEBUG_LEVEL=1
    -D WHALE_FW_VERSION=\"0.1.0\"
    -Wall

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12     ; ★ 许可证 FreeBSD（比 MIT 还宽松 → 可进 MIT 项目）
    ; 刻意不引其它库：JSON 用不到（中枢下行口是"一行纯文本"协议），
    ; HTTPS 用 Arduino 自带的 WiFiClientSecure，够用且少一个供应链面。

monitor_speed = 115200
upload_speed  = 921600
